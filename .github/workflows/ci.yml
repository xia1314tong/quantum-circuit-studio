name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.10, offscreen Qt)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: 冒烟检查
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import quantum_circuit_studio.engine as e; print(e.simulate_circuit(2, [{'name':'H','wire':0,'col':0}]).labels)"
          python -c "from quantum_circuit_studio.thresholds import ghz_tvd, teaching_threshold; print(round(ghz_tvd(4, 0.1), 6), round(teaching_threshold(4), 6))"